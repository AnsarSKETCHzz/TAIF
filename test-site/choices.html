<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TAIF Choice Lab</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:2rem auto 12rem;padding:0 1rem;color:#182934}
  .plan{padding:1.2rem;border:1px solid #ccd6d8;border-radius:12px}
  .cta{font-size:20px;padding:14px 28px;background:#166b5b;color:#fff;border:0;border-radius:8px}
  .fine{font-size:9px;color:#bbb;margin-top:900px}
  .banner{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ccc;padding:16px;display:flex;gap:16px;align-items:center}
  .accept{font-size:18px;padding:14px 40px;background:#0b57d0;color:#fff;border:0;border-radius:8px}
  .reject{font-size:10px;color:#c8c8c8;background:none;border:0;padding:2px}
</style></head>
<body>
  <h1>Premium plan — synthetic</h1>
  <div class="plan"><p>Watch everything in HD.</p><button class="cta">Start free trial</button></div>
  <p class="fine">After your 7-day trial, your plan automatically renews at $14.99/month until you cancel. Non-refundable.</p>
  <div class="banner"><span>We use cookies.</span><button class="accept">Accept all</button><button class="reject">Reject</button></div>
</body>
</html>
