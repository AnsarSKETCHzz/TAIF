<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAIF Fake Alert Lab</title>
  <style>body{font:16px/1.5 system-ui,sans-serif;margin:0}#warn{position:fixed;inset:0;background:#0a3d91;color:#fff;padding:3rem;z-index:999}#warn a,#warn button{display:inline-block;margin:.5rem .5rem 0 0;padding:.7rem 1rem;background:#fff;color:#0a3d91;border-radius:6px;font-weight:700;border:0}</style>
</head>
<body>
  <div id="warn" role="alertdialog" aria-label="Security warning">
    <h1>⚠ Windows Defender Alert</h1>
    <p>Your computer is infected with 5 viruses. Download the cleaner immediately or your files will be lost.</p>
    <a href="files/SystemCleaner.exe">Download cleaner</a>
    <button id="allow">Click Allow to continue</button>
    <p><small>SYNTHETIC TEST PAGE. The download link points to a file that does not exist.</small></p>
  </div>
  <script>document.querySelector("#allow").addEventListener("click", () => { if ("Notification" in window) Notification.requestPermission(); });</script>
</body>
</html>
